<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dupont Borough • Light Pole Sign In</title><style>
*{box-sizing:border-box}body{margin:0;background:#edf2f7;color:#192f48;font:16px/1.6 system-ui,sans-serif;min-height:100vh;display:grid;place-items:center;padding:20px}main{width:100%;max-width:450px;background:white;padding:38px;border-radius:18px;box-shadow:0 10px 35px #12293b15;border-top:7px solid #244e70}h1{line-height:1.2;font-size:29px;margin:12px 0}small{font-weight:700;letter-spacing:1.8px;color:#526778}p{color:#526778}label{display:block;font-weight:650}input,button{width:100%;font:inherit;padding:12px;border-radius:8px;margin-top:8px}input{border:1px solid #a1adbb}button{background:#244e70;color:white;border:0;cursor:pointer;margin-top:18px}button:disabled{opacity:.6}#status{color:#a02525;min-height:1.6em}a{color:#244e70}</style></head><body><main><small>DUPONT BOROUGH</small><h1>Light Pole<br>Address Verification</h1><p>Enter the shared password to view poles and save the nearest house addresses.</p><form id="login"><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required autofocus><button id="submit" type="submit">Open app</button><p id="status" role="alert"></p></form></main><script>
document.getElementById('login').onsubmit=async e=>{e.preventDefault();const button=document.getElementById('submit'),status=document.getElementById('status');button.disabled=true;status.textContent='Signing in…';try{const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:document.getElementById('password').value})});if(r.status===429)throw Error('Too many attempts. Please wait one minute.');const data=await r.json();if(!r.ok)throw Error(data.error||'Sign-in failed.');location.assign('/app');}catch(err){status.textContent=err.message==='Unexpected token'?'This app must be deployed with its Netlify functions.':err.message;}finally{button.disabled=false;}};
</script></body></html>
